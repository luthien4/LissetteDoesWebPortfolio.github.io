<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SQL and database analytics illustration</title>
  <desc id="desc">Pastel dashboard-style illustration with database tables, SQL query panels, charts, and data flow arrows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfb"/>
      <stop offset=".55" stop-color="#eef8f7"/>
      <stop offset="1" stop-color="#fdf6f3"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78cdd0"/>
      <stop offset="1" stop-color="#4d9db8"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cce8d4"/>
      <stop offset="1" stop-color="#8dbb8c"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd3cc"/>
      <stop offset="1" stop-color="#f28f84"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#5d8491" flood-opacity=".18"/>
    </filter>
    <style>
      .panel{fill:#fff;stroke:#dce9ec;stroke-width:2;filter:url(#shadow)}
      .soft{fill:#eef8f7}
      .line{stroke:#8ab8c5;stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:9 13}
      .muted{fill:#d9d9d9}
      .text{fill:#8797a0}
      .stroke{stroke:#6aaebf;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
